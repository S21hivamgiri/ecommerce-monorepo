name: Deploy dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      services: ${{ steps.diff.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        run: |
          chmod +x tools/detect-changed-services.sh
          
          # Safely resolve the base SHA depending on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA=$(git rev-parse HEAD~1)
          fi

          HEAD_SHA="${{ github.sha }}"
          
          echo "Base commit: $BASE_SHA"
          echo "Head commit: $HEAD_SHA"
          
          SERVICES=$(tools/detect-changed-services.sh "$BASE_SHA" "$HEAD_SHA" | tr '\n' ' ')
          echo "Detected services: '$SERVICES'"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  build-test-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != ''
    runs-on: self-hosted
    outputs:
      services: ${{ needs.detect-changes.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - name: Test impacted targets
        run: |
          TARGETS=""
          
          for svc in ${{ needs.detect-changes.outputs.services }}; do
            if [ "$svc" = "gateway" ]; then
              continue
            fi
            TARGETS="$TARGETS //services/$svc:tests "
          done

          # Safe check for gateway without breaking 'set -e'
          if echo "${{ needs.detect-changes.outputs.services }}" | grep -qw "gateway"; then
            TARGETS="$TARGETS //gateway:tests "
          fi

          echo "Target string: '$TARGETS'"

          if [ -z "$(echo "$TARGETS" | xargs)" ]; then
            echo "No test targets found to run."
            exit 0
          fi

          bazel test $TARGETS --test_output=errors